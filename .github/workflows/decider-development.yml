name: Decider development checks

on:
  push:
    branches: [decider-development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: development/decider

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm run check
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: decider-development-preview
          path: development/decider/dist/
          if-no-files-found: error
